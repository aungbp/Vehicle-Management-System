<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body data-protected="true">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Management System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="./index.html">Customers</a></li>
          <li class="nav-item"><a class="nav-link" href="./views/vehicles.html">Vehicles</a></li>
          <li class="nav-item"><a class="nav-link" href="views/rental.html">Rentals</a></li>
          <li class="nav-item"><a class="nav-link" href="./views/reservation.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="./views/vehicle_list.html">Vehicle Search</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <span id="loggedUserName" class="fw-semibold text-dark me-2"></span>
          <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Logout</button>
        </div>

      </div>
    </div>
  </nav>

  <div class="container py-5 d-flex flex-column align-items-center">
    <div class="app-card shadow-lg bg-white rounded-4">
      <h1 class="text-center mb-4 fw-bold">Customer Management System</h1>

      <!-- Add User Form -->
      <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body">
          <h4 class="mb-3">Add a User</h4>
          <form id="userForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">User Type</label>
                <select id="userRole" class="form-control" required>
                  <option value="">Select Type</option>
                  <option value="customer">Customer</option>
                  <option value="staff">Staff</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" id="userName" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="userEmail" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" id="userPhone" class="form-control" required pattern="[0-9]{10}" />
              </div>
              <div class="col-md-6 d-none" id="customerAddressDiv">
                <label class="form-label">Address</label>
                <input type="text" id="customerAddress" class="form-control" />
              </div>
              <div class="col-md-6 d-none" id="customerTypeDiv">
                <label class="form-label">Type</label>
                <select id="customerType" class="form-control">
                  <option value="">Select Type</option>
                  <option value="Private">Private</option>
                  <option value="Corporate">Corporate</option>
                </select>
              </div>
              <div class="col-md-6 d-none" id="customerStatusDiv">
                <label class="form-label">Active Status</label>
                <select id="customerStatus" class="form-control">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-6 d-none" id="staffRoleDiv">
                <label class="form-label">Staff Role</label>
                <input type="text" id="staffRole" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" id="userPassword" class="form-control" required />
              </div>
            </div>
            <button id="submitBtn" type="submit" class="btn btn-primary w-100 rounded-3 mt-3">Add User</button>
          </form>
        </div>
      </div>

      <!-- Customer List -->
      <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body">
          <h4 class="mb-3">Customer List</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Registration Date</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody id="customerTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Staff List -->
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
          <h4 class="mb-3">Staff List</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Staff Role</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody id="staffTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/models/user_model.js"></script>
  <script src="js/view/user_view.js"></script>
  <script src="js/controller/user_controller.js"></script>
  <script src="js/controller/session_controller.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
