<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentals</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-dark" href="../index.html">Management System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Customers</a></li>
          <li class="nav-item"><a class="nav-link" href="vehicles.html">Vehicles</a></li>
          <li class="nav-item"><a class="nav-link active" href="rental.html">Rentals</a></li>
          <li class="nav-item"><a class="nav-link" href="reservation.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="vehicle_list.html">Vehicle Search</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <span id="loggedUserName" class="fw-semibold text-dark me-2"></span>
          <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- RENTAL TABLE -->
  <div class="container py-5">
    <h1 class="text-center mb-4 fw-bold">Rentals</h1>
    <p class="text-center text-muted" id="roleViewLabel"></p>

    <input
      type="text"
      id="rentalSearchInput"
      class="form-control mb-4 form-control-lg"
      placeholder="Search by rental date, return date, or status..."
    />
    <div id="rentalContainer" class="table-responsive"></div>
  </div>

  <!-- JS FILES -->
  <script src="../js/models/rental_model.js"></script>
  <script src="../js/view/rental_view.js"></script>
  <script src="../js/controller/rental_controller.js"></script>
  <script src="../js/controller/session_controller.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Role label setup
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if (currentUser) {
      const label = document.getElementById("roleViewLabel");
      label.textContent =
        currentUser.role === "staff"
          ? "Staff View — Manage and Close Transactions"
          : "Customer View — Your Rental Overview";
    }
  </script>
</body>
</html>
