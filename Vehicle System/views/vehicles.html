<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Management System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Management System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">Customers</a></li>
          <li class="nav-item"><a class="nav-link active" href="./vehicles.html">Vehicles</a></li>
          <li class="nav-item"><a class="nav-link" href="rental.html">Rentals</a></li>
          <li class="nav-item"><a class="nav-link" href="reservation.html">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="./vehicle_list.html">Vehicle Search</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <span id="loggedUserName" class="fw-semibold text-dark me-2"></span>
          <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Logout</button>
        </div>

      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container py-5 d-flex flex-column align-items-center">
    <div class="app-card shadow-lg bg-white rounded-4">
      <h1 class="text-center mb-4 fw-bold">Vehicle Management System</h1>

      <!-- Add Vehicle Form -->
      <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body">
          <h4 class="mb-3">Add a Vehicle</h4>
          <form id="vehicleForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Make</label>
                <input type="text" id="make" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Model</label>
                <input type="text" id="model" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Year</label>
                <input type="number" id="year" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Registration Number</label>
                <input type="text" id="registrationNumber" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Type</label>
                <input type="text" id="type" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Daily Rate</label>
                <input type="number" id="dailyRate" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Mileage</label>
                <input type="number" id="mileage" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Availability</label>
                <select id="availability" class="form-control" required>
                  <option value="Available">Available</option>
                  <option value="Not Available">Not Available</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" id="location" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <input type="text" id="status" class="form-control" placeholder="Enter vehicle status" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-3 mt-3">Add Vehicle</button>
          </form>
        </div>
      </div>

      <!-- Vehicle List -->
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
          <h4 class="mb-3">Vehicles List</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Make</th>
                  <th>Model</th>
                  <th>Year</th>
                  <th>Registration #</th>
                  <th>Type</th>
                  <th>Daily Rate</th>
                  <th>Mileage</th>
                  <th>Availability</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th class="text-center sticky-action-header">Action</th>
                </tr>
              </thead>
              <tbody id="vehicleTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="../js/models/vehicle_model.js"></script>
  <script src="../js/view/vehicle_view.js"></script>
  <script src="../js/controller/vehicle_controller.js"></script>
  <script src="../js/controller/session_controller.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
