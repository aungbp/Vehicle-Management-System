<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | User Management</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

  <div class="card p-4 rounded-4 shadow-lg" style="max-width: 400px; width: 100%; margin-top: 80px;">
    <h3 class="text-center mb-4 fw-bold">Login</h3>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username or email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" id="showPassword" class="form-check-input">
        <label class="form-check-label" for="showPassword">Show Password</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-3">Login</button>
    </form>
    <div class="text-danger mt-3 text-center" id="loginMessage" style="display:none;">Invalid username/email or password.</div>
  </div>

  <script src="../js/models/login_model.js"></script>
  <script src="../js/controller/login_controller.js"></script>
  <script src="../js/controller/session_controller.js"></script>
</body>
</html>
